server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-campos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agro}
    username: ${DB_USER:campos_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: campos
  security:
    oauth2:
      resourceserver:
        jwt:
          # Debe coincidir con el "iss" de los tokens (KC_HOSTNAME del docker-compose)
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/agro}
          # Dónde pedir las claves públicas; dentro de Docker se pisa con http://keycloak:8080/...
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/agro/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health

agro:
  # Cliente hacia ms-tratamientos (reenvía el token del usuario). Ver docs/cliente-tratamientos.md
  tratamientos:
    url-base: ${TRATAMIENTOS_URL:http://localhost:8082}
    timeout-conexion: 2s
    timeout-lectura: 5s
    reintentos-lectura: 1
  # APIs públicas que se consultan al crear un lote. Ver docs/clientes-externos.md
  externas:
    # false = no consulta SoilGrids ni Georef (los lotes quedan SIN_DATOS y el agrónomo carga el suelo a mano)
    habilitado: ${AGRO_EXTERNOS_HABILITADO:true}
    soilgrids:
      url-base: ${SOILGRIDS_URL:https://rest.isric.org/soilgrids/v2.0}
      profundidad: 0-5cm
      timeout-conexion: 3s
      timeout-lectura: 10s
      reintentos: 1
    georef:
      url-base: ${GEOREF_URL:https://apis.datos.gob.ar/georef/api/v2.0}
      timeout-conexion: 3s
      timeout-lectura: 5s
      reintentos: 1
    textura:
      umbral-arena-pct: 50
      umbral-arcilla-pct: 35
  # Datos de prueba locales. Los sub tienen que coincidir con los usuarios de docker/keycloak/realm-agro.json
  datos-iniciales: ${AGRO_DATOS_INICIALES:true}
  seed:
    productor1-sub: ${SEED_PRODUCTOR1_SUB:11111111-1111-1111-1111-000000000001}
    productor2-sub: ${SEED_PRODUCTOR2_SUB:11111111-1111-1111-1111-000000000002}
    operario1-sub: ${SEED_OPERARIO1_SUB:22222222-2222-2222-2222-000000000001}
