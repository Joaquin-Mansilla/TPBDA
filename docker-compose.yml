# TPI Backend agro: los 5 contenedores en la red agro-net.
# Publicados hacia afuera: solo el Gateway (8080) y Keycloak (8081).
#
# Uso:   cp .env.example .env     (y cambiar las contraseñas)
#        docker compose up -d --build     (la primera vez tarda: compila los tres servicios)

services:

  postgres:
    image: postgres:16
    container_name: agro-postgres
    environment:
      POSTGRES_DB: agro                      # base de negocio; se crea sola
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Las leen los scripts de initdb para crear un usuario por servicio
      CAMPOS_DB_PASSWORD: ${CAMPOS_DB_PASSWORD}
      TRATAMIENTOS_DB_PASSWORD: ${TRATAMIENTOS_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Se ejecutan solo la primera vez, cuando el volumen está vacío
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d agro"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agro-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: agro-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # URL pública fija: el issuer de TODOS los tokens es http://localhost:8081/realms/agro,
      # se pidan desde Postman o desde adentro de Docker. Así los servicios validan un solo issuer.
      KC_HOSTNAME: http://localhost:8081
      # Permite que los servicios dentro de Docker usen http://keycloak:8080 para pedir las claves (JWKS)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      # Keycloak importa todos los .json de esta carpeta al arrancar (si el realm no existe)
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen no trae curl: se consulta el endpoint de salud (puerto de gestión 9000) con bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - agro-net

  ms-tratamientos:
    build:
      context: .
      dockerfile: ms-tratamientos/Dockerfile
    image: agro/ms-tratamientos
    container_name: agro-ms-tratamientos
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agro
      DB_USER: tratamientos_user
      DB_PASSWORD: ${TRATAMIENTOS_DB_PASSWORD}
      # El "iss" de los tokens siempre es localhost:8081 (KC_HOSTNAME fijo); las claves se piden por la red interna
      JWT_ISSUER_URI: http://localhost:8081/realms/agro
      JWT_JWK_SET_URI: http://keycloak:8080/realms/agro/protocol/openid-connect/certs
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # La imagen no trae curl: se consulta /actuator/health con bash, igual que en keycloak
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && echo -e 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - agro-net

  ms-campos:
    build:
      context: .
      dockerfile: ms-campos/Dockerfile
    image: agro/ms-campos
    container_name: agro-ms-campos
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agro
      DB_USER: campos_user
      DB_PASSWORD: ${CAMPOS_DB_PASSWORD}
      JWT_ISSUER_URI: http://localhost:8081/realms/agro
      JWT_JWK_SET_URI: http://keycloak:8080/realms/agro/protocol/openid-connect/certs
      # ms-campos llama a ms-tratamientos por la red interna, sin pasar por el gateway (T10)
      TRATAMIENTOS_URL: http://ms-tratamientos:8082
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && echo -e 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - agro-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: agro/gateway
    container_name: agro-gateway
    environment:
      CAMPOS_URL: http://ms-campos:8083
      TRATAMIENTOS_URL: http://ms-tratamientos:8082
      JWT_ISSUER_URI: http://localhost:8081/realms/agro
      JWT_JWK_SET_URI: http://keycloak:8080/realms/agro/protocol/openid-connect/certs
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      ms-campos:
        condition: service_healthy
      ms-tratamientos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - agro-net

volumes:
  postgres-data:

networks:
  agro-net:
    name: agro-net
