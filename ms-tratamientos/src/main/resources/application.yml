server:
  port: ${PORT:8082}

spring:
  application:
    name: ms-tratamientos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agro}
    username: ${DB_USER:tratamientos_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: tratamientos
  security:
    oauth2:
      resourceserver:
        jwt:
          # Debe coincidir con el "iss" de los tokens (KC_HOSTNAME del docker-compose)
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/agro}
          # Dónde pedir las claves públicas; dentro de Docker se pisa con http://keycloak:8080/...
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/agro/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health

agro:
  # Carga los datos de ejemplo (catálogo) si las tablas están vacías
  datos-iniciales: ${AGRO_DATOS_INICIALES:true}
